<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Флеш-картки: Країни</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FDFBF8;
            color: #4A4A4A;
        }
        .card-container {
            perspective: 1000px;
            transition: transform 0.6s;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card-front {
            background-color: #EFEBE5;
            z-index: 2;
        }
        .card-back {
            background-color: #A4907C;
            transform: rotateY(180deg);
            color: white;
        }
        .flag-emoji {
            font-size: 4rem;
        }
        .symbol-emoji {
            font-size: 3rem;
        }
        .card-container:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="antialiased">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">

        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-[#8D7B68] mb-2">Флеш-картки: Країни</h1>
            <p class="text-xl text-gray-600">Вивчіть назви країн словацькою мовою</p>
        </header>

        <main>
            <div id="flashcard-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- Flashcards will be dynamically generated here -->
            </div>
        </main>

    </div>

    <script>
        const countriesData = [
            { ukrainian: 'Україна', slovak: 'Ukrajina', flag: '🇺🇦', symbol: '🌻' },
            { ukrainian: 'Словаччина', slovak: 'Slovensko', flag: '🇸🇰', symbol: '🏰' },
            { ukrainian: 'Чехія', slovak: 'Česko', flag: '🇨🇿', symbol: '🍺' },
            { ukrainian: 'Польща', slovak: 'Poľsko', flag: '🇵🇱', symbol: '🇵🇱' },
            { ukrainian: 'Угорщина', slovak: 'Maďarsko', flag: '🇭🇺', symbol: '♨️' },
            { ukrainian: 'Австрія', slovak: 'Rakúsko', flag: '🇦🇹', symbol: '🎻' },
            { ukrainian: 'Німеччина', slovak: 'Nemecko', flag: '🇩🇪', symbol: '🥨' },
            { ukrainian: 'Литва', slovak: 'Litva', flag: '🇱🇹', symbol: '🏛️' },
            { ukrainian: 'Латвія', slovak: 'Lotyšsko', flag: '🇱🇻', symbol: '🏛️' },
            { ukrainian: 'Естонія', slovak: 'Estónsko', flag: '🇪🇪', symbol: '🏛️' },
            { ukrainian: 'Хорватія', slovak: 'Chorvátsko', flag: '🇭🇷', symbol: '🏖️' },
            { ukrainian: 'Болгарія', slovak: 'Bulharsko', flag: '🇧🇬', symbol: '🌹' },
            { ukrainian: 'Румунія', slovak: 'Rumunsko', flag: '🇷🇴', symbol: '🧛' },
            { ukrainian: 'Греція', slovak: 'Grécko', flag: '🇬🇷', symbol: '🏛️' },
            { ukrainian: 'Італія', slovak: 'Taliansko', flag: '🇮🇹', symbol: '🍕' },
            { ukrainian: 'Іспанія', slovak: 'Španielsko', flag: '🇪🇸', symbol: '💃' },
            { ukrainian: 'Франція', slovak: 'Francúzsko', flag: '🇫🇷', symbol: '🗼' },
            { ukrainian: 'Китай', slovak: 'Čína', flag: '🇨🇳', symbol: '🐉' },
            { ukrainian: 'Америка', slovak: 'Amerika', flag: '🇺🇸', symbol: '🗽' },
            { ukrainian: 'Велика Британія', slovak: 'Veľká Británia', flag: '🇬🇧', symbol: '💂‍♂️' }
        ];

        const flashcardGrid = document.getElementById('flashcard-grid');

        countriesData.forEach(country => {
            const cardContainer = document.createElement('div');
            cardContainer.className = 'card-container h-48 sm:h-56 md:h-64 cursor-pointer';

            const cardInner = document.createElement('div');
            cardInner.className = 'card-inner';

            const cardFront = document.createElement('div');
            cardFront.className = 'card-front';
            cardFront.innerHTML = `
                <p class="flag-emoji">${country.flag}</p>
                <p class="text-xl font-semibold mt-2">${country.ukrainian}</p>
            `;

            const cardBack = document.createElement('div');
            cardBack.className = 'card-back';
            cardBack.innerHTML = `
                <p class="symbol-emoji">${country.symbol}</p>
                <p class="text-2xl font-bold mt-2">${country.slovak}</p>
            `;

            cardInner.appendChild(cardFront);
            cardInner.appendChild(cardBack);

            cardContainer.appendChild(cardInner);

            cardContainer.addEventListener('click', () => {
                cardContainer.classList.toggle('flipped');
            });

            flashcardGrid.appendChild(cardContainer);
        });
    </script>
</body>
</html>
