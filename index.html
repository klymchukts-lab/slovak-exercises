<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Slovak Exercises</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      max-width: 800px;
      width: 90%;
    }

    h1 {
      font-size: 2.2em;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    p {
      color: #555;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .btn {
      display: block;
      padding: 15px;
      background: #3498db;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn:hover {
      background: #2980b9;
      transform: translateY(-3px);
    }

    .icon {
      width: 60px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://cdn-icons-png.flaticon.com/512/4151/4151022.png" alt="Slovak Icon" class="icon">
    <h1>Slovak Exercises</h1>
    <p>Vyber si cvičenie:</p>

    <div class="grid">
      <a href="sortovanie.html" class="btn">РОЗПОДІЛІТЬ ІМЕННИКИ ЗА РОДОМ</a>
      <a href="countries.html" class="btn">Флеш-картки: Країни</a>
      <a href="vyberkrajiny.html" class="btn">Виберіть країну</a>
      <a href="peniazeconnect.html" class="btn">Фінансова грамотність квіз</a>
      <a href="peniazekviz.html" class="btn">Фінансова грамотність поєднати</a>
      <a href="#" class="btn">Ďalšie cvičenie</a>
      <a href="#" class="btn">Gramatika</a>
    </div>
  </div>
</body>
</html>
